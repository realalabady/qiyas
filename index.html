<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/al-maarefah-icon.png" />
    <link rel="apple-touch-icon" href="/al-maarefah-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary meta tags -->
    <title>المعرفة — اختبارات شخصية وذكاء ومقالات نفسية مجانًا</title>
    <meta
      name="title"
      content="Al-Maarefah — Free Personality, IQ & Fun Quizzes"
    />
    <meta
      name="description"
      content="Al-Maarefah is a free bilingual (Arabic/English) quiz platform. Discover your personality, test your IQ, and explore fun quizzes — no account required, instant results."
    />
    <meta
      name="keywords"
      content="quizzes, personality test, IQ test, Arabic quizzes, اختبارات, اختبار شخصية, المعرفة, Al-Maarefah"
    />
    <meta name="author" content="Al-Maarefah" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Al-Maarefah" />
    <meta
      property="og:title"
      content="Al-Maarefah — Free Personality, IQ & Fun Quizzes"
    />
    <meta
      property="og:description"
      content="Discover your personality, test your IQ, and explore fun bilingual quizzes — no account required, instant results."
    />
    <meta property="og:image" content="/al-maarefah-icon.png" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@almaarefahh" />
    <meta name="twitter:creator" content="@almaarefahh" />
    <meta
      name="twitter:title"
      content="Al-Maarefah — Free Personality, IQ & Fun Quizzes"
    />
    <meta
      name="twitter:description"
      content="Discover your personality, test your IQ, and explore fun bilingual quizzes — no account required, instant results."
    />
    <meta name="twitter:image" content="/al-maarefah-header.png" />

    <!--
      Default to noindex, and let the server-side renderer take it off.

      This file ships as app.html, the shell every unmatched path falls
      through to. Those paths answered 200 with an empty #root and no robots
      directive — so /search, a quiz's /take and /result pages, /not-found
      itself, and any mistyped URL all looked to Google like a real page with
      no content. That is what Search Console reports as Soft 404, and the
      set of such URLs is unbounded.

      Pages that genuinely should be indexed never keep this tag: api/render.ts
      strips every robots meta out of the shell before injecting its own, so an
      SSR-rendered page emits noindex only when it actually means it.
    -->
    <meta name="robots" content="noindex" />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9730070284221534"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
